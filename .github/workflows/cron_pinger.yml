name: Emitara Realtime News Pinger

on:
  schedule:
    # Run every 10 minutes 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  poll-news:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Emitara Scraper on Vercel
        run: |
          curl -s -f -m 15 "https://emitara-stock.vercel.app/api/cron/poll" || echo "Poll ping sent"
